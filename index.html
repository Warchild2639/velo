<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Velódromo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 8px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: #1c1c1c;
            border-radius: 20px;
            padding: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 {
            text-align: center;
            margin-top: 0;
            font-size: 24px;
            margin-bottom: 12px;
        }

        .objetivo {
            margin-bottom: 10px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 9px 12px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            background: #2b2b2b;
            color: white;
            outline: none;
        }

        .distancia {
            text-align: center;
            margin: 12px 0;
        }

        .distancia .numero {
            font-size: 38px;
            font-weight: bold;
        }

        .distancia .texto {
            color: #aaa;
        }

        .botones {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .control-principal {
            width: 100%;
            margin-bottom: 4px;
            background: #16a34a;
        }

        .pausa {
            width: 100%;
            margin-top: 8px;
            background: #ca8a04;
        }

        .finalizar {
            width: 100%;
            margin-top: 10px;
            background: #dc2626;
        }

        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 12px 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            transition: transform 0.1s, opacity 0.1s;
        }

        button:active {
            transform: scale(0.97);
            opacity: 0.8;
        }

        .corto {
            background: #2878d0;
        }

        .largo {
            background: #d05a28;
        }

        .info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 7px;
            margin-top: 10px;
        }

        .card {
            background: #292929;
            border-radius: 12px;
            padding: 10px 6px;
            text-align: center;
        }

        .card .titulo {
            color: #999;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .card .valor {
            font-size: 18px;
            font-weight: bold;
        }

        .compartir {
            width: 100%;
            margin-top: 7px;
            background: #7c3aed;
            padding: 9px;
        }

        .reset {
            width: 100%;
            margin-top: 7px;
            background: #444;
            padding: 9px;
        }

        .completado {
            color: #4ade80;
            font-weight: bold;
            text-align: center;
            margin-top: 7px;
            display: none;
        }

        @media (max-width: 450px) {
            body { padding: 4px; align-items: flex-start; }
            .container { padding: 10px; border-radius: 12px; }
            h1 { font-size: 21px; margin-bottom: 8px; }
            .objetivo { margin-bottom: 6px; }
            input { padding: 7px 10px; }
            .distancia { margin: 7px 0; }
            .distancia .numero { font-size: 32px; }
            .distancia .texto { font-size: 13px; }
            button { padding: 9px 6px; font-size: 14px; }
            .info { margin-top: 7px; gap: 5px; }
            .card { padding: 7px 4px; }
            .card .titulo { font-size: 12px; margin-bottom: 3px; }
            .card .valor { font-size: 16px; }
            .finalizar { margin-top: 7px; }
            .compartir, .reset { margin-top: 5px; padding: 7px; }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🚴 Control de Velódromo</h1>

    <div class="objetivo">
        <label for="objetivo">Kilómetros que tengo que caminar:</label>
        <input 
            type="number" 
            id="objetivo" 
            placeholder="Ej: 12.5" 
            step="0.1"
            min="0"
            oninput="actualizar()"
        >
    </div>

    <div class="distancia">
        <div class="numero" id="distanciaActual">0.0 km</div>
        <div class="texto">recorridos</div>
    </div>

    <button class="control-principal" id="btnInicio" onclick="iniciarEntrenamiento()">
        ▶ Iniciar entrenamiento
    </button>

    <div class="botones">
        <button class="corto" onclick="agregarVuelta(1.1)">
            + 1.1 km<br>
            <small>Circuito corto</small>
        </button>

        <button class="largo" onclick="agregarVuelta(2.6)">
            + 2.6 km<br>
            <small>Circuito largo</small>
        </button>
    </div>

    <button class="pausa" id="btnPausa" onclick="alternarPausa()" disabled>
        ⏸ Pausar
    </button>

    <div class="info">

        <div class="card">
            <div class="titulo">Falta</div>
            <div class="valor" id="faltante">—</div>
        </div>

        <div class="card">
            <div class="titulo">Última vuelta</div>
            <div class="valor" id="tiempoVuelta">—</div>
        </div>

        <div class="card">
            <div class="titulo">Tiempo total</div>
            <div class="valor" id="tiempoTotal">00:00:00</div>
        </div>

        <div class="card">
            <div class="titulo">Velocidad promedio</div>
            <div class="valor" id="velocidad">0.0 km/h</div>
        </div>

    </div>

    <div class="completado" id="completado">
        ¡Objetivo completado! 🎉
    </div>

    <button class="finalizar" id="btnFinalizar" onclick="finalizarEntrenamiento()" disabled>
        ■ Finalizar entrenamiento
    </button>

    <button class="compartir" id="btnCompartir" onclick="compartirEntrenamiento()" disabled>
        📤 Compartir entrenamiento
    </button>

    <button class="reset" onclick="reiniciar()">
        Reiniciar
    </button>

</div>

<script>

    let distancia = 0;
    let inicio = null;
    let ultimaVuelta = null;
    let intervalo = null;
    let pausado = false;
    let pausaInicio = null;
    let tiempoPausadoTotal = 0;
    let vueltas = [];
    let finalizado = false;

    function formatearTiempo(segundos) {
        segundos = Math.floor(segundos);

        const horas = Math.floor(segundos / 3600);
        const minutos = Math.floor((segundos % 3600) / 60);
        const secs = segundos % 60;

        return (
            String(horas).padStart(2, '0') + ':' +
            String(minutos).padStart(2, '0') + ':' +
            String(secs).padStart(2, '0')
        );
    }

    function iniciarEntrenamiento() {
        if (inicio !== null && !finalizado) return;

        distancia = 0;
        vueltas = [];
        pausado = false;
        pausaInicio = null;
        tiempoPausadoTotal = 0;
        finalizado = false;
        inicio = Date.now();
        ultimaVuelta = inicio;

        if (intervalo !== null) clearInterval(intervalo);
        intervalo = setInterval(actualizarTiempo, 1000);

        document.getElementById("btnInicio").disabled = true;
        document.getElementById("btnPausa").disabled = false;
        document.getElementById("btnFinalizar").disabled = false;
        actualizar();
        actualizarTiempo();
    }

    function alternarPausa() {
        if (inicio === null || finalizado) return;

        const btn = document.getElementById("btnPausa");

        if (!pausado) {
            pausado = true;
            pausaInicio = Date.now();
            btn.textContent = "▶ Reanudar";
        } else {
            const ahora = Date.now();
            const duracionPausa = ahora - pausaInicio;
            tiempoPausadoTotal += duracionPausa;
            ultimaVuelta += duracionPausa;
            pausaInicio = null;
            pausado = false;
            btn.textContent = "⏸ Pausar";
        }

        actualizarTiempo();
    }

    function agregarVuelta(km) {
        if (inicio === null || pausado || finalizado) return;

        const ahora = Date.now();
        const segundosVuelta = Math.max(0, (ahora - ultimaVuelta) / 1000);

        document.getElementById("tiempoVuelta").textContent =
            formatearTiempo(segundosVuelta);

        distancia += km;
        vueltas.push({
            numero: vueltas.length + 1,
            distanciaKm: km,
            hora: new Date(ahora).toISOString(),
            duracionSegundos: Math.round(segundosVuelta)
        });

        ultimaVuelta = ahora;
        actualizar();
        actualizarTiempo();
    }

    function finalizarEntrenamiento() {
        if (inicio === null || finalizado) return;

        const ahora = Date.now();
        let pausadoExtra = 0;
        if (pausado && pausaInicio !== null) {
            pausadoExtra = ahora - pausaInicio;
        }

        const segundosActivos = Math.max(0, (ahora - inicio - tiempoPausadoTotal - pausadoExtra) / 1000);
        const objetivo = parseFloat(document.getElementById("objetivo").value);
        const entrenamiento = {
            fechaInicio: new Date(inicio).toISOString(),
            fechaFin: new Date(ahora).toISOString(),
            objetivoKm: isNaN(objetivo) ? null : objetivo,
            distanciaKm: Number(distancia.toFixed(2)),
            tiempoActivoSegundos: Math.round(segundosActivos),
            tiempoActivo: formatearTiempo(segundosActivos),
            velocidadPromedioKmh: segundosActivos > 0 ? Number((distancia / (segundosActivos / 3600)).toFixed(2)) : 0,
            vueltas: vueltas
        };

        const historial = JSON.parse(localStorage.getItem("historialEntrenamientos") || "[]");
        historial.push(entrenamiento);
        localStorage.setItem("historialEntrenamientos", JSON.stringify(historial));
        localStorage.setItem("ultimoEntrenamiento", JSON.stringify(entrenamiento));

        finalizado = true;
        pausado = false;
        if (intervalo !== null) {
            clearInterval(intervalo);
            intervalo = null;
        }

        document.getElementById("btnPausa").disabled = true;
        document.getElementById("btnFinalizar").disabled = true;
        document.getElementById("btnInicio").disabled = false;
        document.getElementById("btnPausa").textContent = "⏸ Pausar";
        document.getElementById("btnCompartir").disabled = false;
        actualizarTiempo();

        alert("Entrenamiento guardado en este dispositivo.");
    }

    function crearTextoEntrenamiento(entrenamiento) {
        const fecha = new Date(entrenamiento.fechaInicio).toLocaleDateString("es-AR");
        const hora = new Date(entrenamiento.fechaInicio).toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" });
        let texto = "ENTRENAMIENTO DE CAMINATA - " + fecha + " " + hora + "\n\n";
        texto += "Objetivo: " + (entrenamiento.objetivoKm !== null ? entrenamiento.objetivoKm + " km" : "sin objetivo") + "\n";
        texto += "Distancia total: " + entrenamiento.distanciaKm + " km\n";
        texto += "Tiempo activo: " + entrenamiento.tiempoActivo + "\n";
        texto += "Velocidad promedio: " + entrenamiento.velocidadPromedioKmh + " km/h\n\n";
        texto += "VUELTAS:\n";

        if (!entrenamiento.vueltas || entrenamiento.vueltas.length === 0) {
            texto += "Sin vueltas registradas.\n";
        } else {
            entrenamiento.vueltas.forEach(vuelta => {
                const velocidadVuelta = vuelta.duracionSegundos > 0
                    ? (vuelta.distanciaKm / (vuelta.duracionSegundos / 3600)).toFixed(2)
                    : "0.00";
                texto += "Vuelta " + vuelta.numero + ": " + vuelta.distanciaKm + " km - " +
                    formatearTiempo(vuelta.duracionSegundos) + " - " + velocidadVuelta + " km/h\n";
            });
        }

        texto += "\nAnalizá este entrenamiento teniendo en cuenta mi preparación para la peregrinación a Luján. Compará el ritmo entre vueltas, mi velocidad promedio y el cumplimiento del objetivo.";
        return texto;
    }

    async function compartirEntrenamiento() {
        const guardado = localStorage.getItem("ultimoEntrenamiento");
        if (!guardado) {
            alert("Todavía no hay un entrenamiento finalizado para compartir.");
            return;
        }

        const entrenamiento = JSON.parse(guardado);
        const texto = crearTextoEntrenamiento(entrenamiento);

        if (navigator.share) {
            try {
                await navigator.share({
                    title: "Entrenamiento de caminata",
                    text: texto
                });
                return;
            } catch (error) {
                if (error.name === "AbortError") return;
            }
        }

        try {
            await navigator.clipboard.writeText(texto);
            alert("Entrenamiento copiado. Abrí ChatGPT y pegalo en la conversación.");
        } catch (error) {
            prompt("Copiá estos datos y pegalos en ChatGPT:", texto);
        }
    }

    function actualizar() {

        const objetivo = parseFloat(
            document.getElementById("objetivo").value
        );

        document.getElementById("distanciaActual").textContent =
            distancia.toFixed(1) + " km";

        if (!isNaN(objetivo) && objetivo > 0) {

            const falta = Math.max(0, objetivo - distancia);

            document.getElementById("faltante").textContent =
                falta.toFixed(1) + " km";

            if (falta <= 0) {
                document.getElementById("completado").style.display = "block";
            } else {
                document.getElementById("completado").style.display = "none";
            }

        } else {
            document.getElementById("faltante").textContent = "—";
        }
    }

    function actualizarTiempo() {

        if (inicio === null) return;

        const ahora = Date.now();
        const pausaActual = (pausado && pausaInicio !== null) ? (ahora - pausaInicio) : 0;
        const segundos = Math.max(0, (ahora - inicio - tiempoPausadoTotal - pausaActual) / 1000);

        document.getElementById("tiempoTotal").textContent =
            formatearTiempo(segundos);

        if (segundos > 0 && distancia > 0) {

            const velocidad = distancia / (segundos / 3600);

            document.getElementById("velocidad").textContent =
                velocidad.toFixed(2) + " km/h";
        }
    }

    function reiniciar() {

        if (intervalo !== null) {
            clearInterval(intervalo);
        }

        distancia = 0;
        inicio = null;
        ultimaVuelta = null;
        intervalo = null;
        pausado = false;
        pausaInicio = null;
        tiempoPausadoTotal = 0;
        vueltas = [];
        finalizado = false;

        document.getElementById("distanciaActual").textContent = "0.0 km";
        document.getElementById("faltante").textContent = "—";
        document.getElementById("tiempoVuelta").textContent = "—";
        document.getElementById("tiempoTotal").textContent = "00:00:00";
        document.getElementById("velocidad").textContent = "0.0 km/h";
        document.getElementById("completado").style.display = "none";
        document.getElementById("btnInicio").disabled = false;
        document.getElementById("btnPausa").disabled = true;
        document.getElementById("btnFinalizar").disabled = true;
        document.getElementById("btnPausa").textContent = "⏸ Pausar";
        document.getElementById("btnCompartir").disabled = localStorage.getItem("ultimoEntrenamiento") === null;
    }

    document.getElementById("btnCompartir").disabled = localStorage.getItem("ultimoEntrenamiento") === null;

</script>

</body>
</html>
```
